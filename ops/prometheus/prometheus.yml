# Prometheus scrape configuration.
#
# Retention is NOT set here -- it is a command-line flag in docker-compose.yml
# (--storage.tsdb.retention.time=15d), because Prometheus ignores a retention
# key in this file entirely. A retention that looks configured and is not is
# how a disk fills three months later. DEPLOYMENT.md 4.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: fking-local

# Alert rules are #101. The file glob is here so that adding rules is a matter
# of dropping a file in, not of also remembering to edit this config.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # Application metrics arrive over OTLP and leave the collector on :8889.
  - job_name: fking-app
    static_configs:
      - targets: ["otel-collector:8889"]

  # The collector's own telemetry. otelcol_exporter_send_failed_* is the series
  # that distinguishes "the application emitted nothing" from "the collector
  # dropped it", and those have entirely different causes.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
