# OpenTelemetry Collector -- telemetry fan-out.
#
# One receiver, three destinations: traces to Tempo, logs to Loki, metrics
# exposed for Prometheus to scrape. The application talks OTLP to this process
# and knows nothing about which backends exist, which is the point of running a
# collector at all on a single node -- swapping Tempo for something else is a
# change to this file rather than to the application.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # memory_limiter must be FIRST in every pipeline. It sheds load when the
  # collector approaches its own ceiling; placed later, the batch processor has
  # already accumulated the memory the limiter exists to prevent.
  # 400 MiB against the container's 512 M limit leaves room for the runtime.
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Loki 3.x ingests OTLP natively. The dedicated `loki` exporter was
  # deprecated upstream in favour of this path; using it would be building on
  # something scheduled for removal.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # Pull-based rather than remote-write: Prometheus scrapes :8889. One fewer
  # moving part, and a Prometheus outage then loses scrapes rather than
  # applying backpressure to the collector.
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    resource_to_telemetry_conversion:
      enabled: true

extensions:
  # Reachable on :13133, but note that the container is distroless and has no
  # shell, so this cannot be wired to a docker HEALTHCHECK. It is here for an
  # operator and for anything scraping from outside the container.
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/loki]
  telemetry:
    logs:
      level: info
    metrics:
      # Self-telemetry on :8888, scraped by Prometheus. A collector that drops
      # data silently is worse than no collector, and otelcol_exporter_send_failed_*
      # is the series that says so.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
