version: 2

updates:
  # uv.lock. Grouped into one pull request per week: a separate PR per package would
  # bury the ones that matter, and every dependency bump in this repository needs the
  # same green `make check` as any other change.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "type:chore"
      - "area:infra"
    groups:
      dev-tooling:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Action versions. Pinned by tag today; a compromised action is a supply-chain path
  # straight into a workflow that holds a token.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "type:chore"
      - "area:infra"
