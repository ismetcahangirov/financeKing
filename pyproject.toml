[project]
name = "fking"
version = "0.1.0"
description = "Autonomous AI trading platform. Demo accounts only."
readme = "README.md"
# Pinned to a single minor version rather than ">=3.12": CI, Docker Compose and the
# developer machine must run the same interpreter, because a version skew in a
# money-handling codebase surfaces as a behaviour difference nobody attributes to
# Python. See .claude/agents/devops.md.
requires-python = ">=3.12,<3.13"

# Deliberately empty. A runtime dependency is added by the pull request that first
# imports it, with its justification in that PR body -- CONTRIBUTING.md requires an
# ADR for any significant dependency adoption. Locking the full ARCHITECTURE.md
# technology set here would pin ~40 packages whose version constraints nobody can
# yet defend, which is the failure mode issue #1 names as this phase's main risk.
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    # The only exchange client (#5, ADR-0008, ARCHITECTURE.md 7). >= 4.5.70 is a floor
    # rather than a preference: it is the first release correct on *both* halves of the
    # current Binance surface -- the spot/futures endpoint split, and the post-listenKey
    # user-data model, where `POST /api/v3/userDataStream` returns 410 Gone and spot
    # authenticates with an Ed25519 `session.logon` instead. python-binance is broken on
    # that path, binance-connector is frozen, and the official binance-sdk-* packages
    # shipped 11 and 16 major versions in twelve months, which is disqualifying for a
    # system that runs unattended.
    #
    # It brings aiohttp transitively, which is why aiohttp is now named in the
    # network-client contract below. ccxt builds its own transport by default, so it is
    # constructed only by fking.platform.safety.guarded_ccxt, which injects a guarded
    # session and re-validates the sandbox URL map.
    "ccxt>=4.5.70",
    # Parquet corpus and its read path (#24, DATA_PIPELINE.md 6). duckdb is the scan
    # engine because it pushes hive partition predicates down into *file selection*, so
    # a filtered query over a thousand-symbol corpus opens only the files that can
    # contribute -- which is the entire return on the partition layout. pyarrow is the
    # writer: it is the only way to declare `decimal128(38, 18)` explicitly, and an
    # inferred schema is how an OHLCV column becomes a double.
    "duckdb>=1.1",
    "httpx>=0.28.1",
    # Telemetry (#18). The SDK plus the OTLP/gRPC exporter is the whole pipeline into
    # the Collector; the three instrumentation packages are exactly the libraries this
    # repository already depends on. FastAPI's joins when fking.api exists -- an
    # instrumentation for a library nobody imports is a dependency with no effect.
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
    "opentelemetry-instrumentation-httpx>=0.55b0",
    "opentelemetry-instrumentation-redis>=0.55b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.55b0",
    "opentelemetry-sdk>=1.30",
    "pyarrow>=18.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    # Not imported by anything in src/fking. duckdb's own conversion of a
    # TIMESTAMP WITH TIME ZONE into a Python datetime imports pytz, and raises
    # `Required module 'pytz' failed to import` without it -- so every read of an
    # `_utc` column depends on it. duckdb does not declare it, which is why it is
    # named here rather than arriving transitively.
    "pytz>=2025.2",
    # Event bus (#18, ADR-0004). Streams, consumer groups and XAUTOCLAIM; the async
    # client ships with the package, so there is no second aioredis dependency.
    "redis>=6.0",
    "sqlalchemy>=2.0.36",
    "structlog>=26.1.0",
    "websockets>=17.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fking"]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "mypy>=1.18.0",
    "import-linter>=2.3",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "pytest-randomly>=3.16",
    "hypothesis>=6.130",
    "coverage>=7.6",
    # Test-only. The compose contract test parses the compose files as YAML rather
    # than grepping them, so a reformat, a line wrap or a comment cannot make a
    # violation invisible to the check. Not a runtime dependency: nothing in
    # src/fking reads YAML.
    "pyyaml>=6.0.2",
    "types-PyYAML>=6.0.12",
    # asyncpg ships no inline types, and mypy --strict treats an untyped import as a
    # source of Any that propagates across every call path touching it.
    "asyncpg-stubs>=0.30",
    # Test-only. TESTING.md and .claude/rules/testing-rules.md require a real
    # PostgreSQL + TimescaleDB rather than a mock, and testcontainers is what makes
    # that the default rather than something a developer has to remember to start.
    # It also binds a random host port, which matters on Windows where 5432 is
    # frequently already taken or reserved.
    "testcontainers[postgres,redis]>=4.15.0",
    # pyarrow ships no py.typed marker, so mypy --strict treats every `pa.*` call as a
    # source of Any and that Any propagates across the whole Parquet write path -- one
    # untyped import silently disabling type checking on the module that decides a
    # column is decimal128 rather than double. duckdb needs no stubs; it ships py.typed.
    "pyarrow-stubs>=20",
    "types-pytz>=2025.2",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]
# ruff also formats Python code blocks embedded in Markdown. The documentation set is
# hand-authored, and its examples are shaped for reading rather than for the
# formatter -- letting ruff reflow them puts 81 unrelated files into every pull
# request that runs `make format`, which is how a diff becomes unreviewable.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# The union of the rule sets named across .claude/rules/. Each set is load-bearing
# for at least one rule in that directory: DTZ for time-and-timezones, BLE/TRY for
# error-handling, G/LOG for logging-rules, ANN/N for naming, S for the eval/exec and
# SQL-string bans in llm-output-handling.
select = [
    "A",    # flake8-builtins
    "ANN",  # flake8-annotations
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "FURB", # refurb
    "G",    # flake8-logging-format
    "I",    # isort
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "TRY",  # tryceratops
    "UP",   # pyupgrade
]
ignore = [
    # verbose-decimal-constructor rewrites Decimal("0") to Decimal(0). String
    # construction is mandatory here even where the value is integral, because the
    # spelling is what reviewers and tools/checks/money_types.py key on.
    "FURB157",
    # raise-vanilla-args: this project deliberately puts context in the message at
    # the raise site -- venue codes, ids, the value that failed. Moving it into the
    # class would produce one exception type per message.
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# N818: both names are specified verbatim by .claude/rules/llm-output-handling.md and by
# issue #70's acceptance criteria, and both read as the refusal they are rather than as a
# fault: `AgentOutputInvalid` and `FencedPayloadRejected` are statements about the input,
# not about a malfunction. Renaming them to `...Error` would make the rule file, the
# acceptance criteria and the code disagree about the name of the thing under test, which
# is a worse outcome than a suffix convention broken in one file with a reason.
"src/fking/agents/_errors.py" = ["N818"]
# A005: `fking.platform.logging` shadows the standard library's `logging`. The name is
# deliberate -- `.claude/rules/logging-rules.md` and OBSERVABILITY.md both name this
# module, and a reader looking for the logging pipeline looks for `logging`. Python 3
# resolves `import logging` inside it to the stdlib module by absolute import, so the
# shadowing is nominal rather than real; nothing in this package imports stdlib logging
# anyway, because structlog is the only logger in this codebase.
"src/fking/platform/logging/*.py" = ["A005"]
# S101: asserting is what a test does. The ban exists for src/, where an assert
# disappears under -O and takes its check with it.
"tests/**/*.py" = ["S101"]
# S603/S607: the boundary-contract test must run lint-imports as a real subprocess.
# Asserting that a violating import fails CI by calling an in-process API would
# prove the API works, not that CI fails.
"tests/adversarial/*.py" = ["S101", "S603", "S607"]
# PLR0913: the domain factories take one keyword per field of the type they build, so
# the argument count is the type's field count. Collapsing them into a params object
# would mean constructing a second object to construct the first.
"tests/support/*.py" = ["PLR0913"]
# PLR0913: the recorder's parameters are its command-line flags, one for one. A params
# object here would be a second thing to keep in step with argparse, and the mismatch
# between the two would be silent.
"tools/record_archive_fragment.py" = ["PLR0913"]
"tools/record_stream_frames.py" = ["PLR0913"]
# PLR0913: the supervisor's constructor is six injected collaborators -- profile,
# symbols, router, writer, clock, RNG, connection factory -- plus one tunable. Every one
# of them exists so that the reconnect schedule and the gap bounds are replayable rather
# than a function of wall-clock time and a module-level random. Bundling them into a
# config object would hide exactly the injection points a reviewer needs to see.
"src/fking/data/live/supervisor.py" = ["PLR0913"]
# S608: the Parquet read path builds `read_parquet('<glob>')` by interpolation, because
# DuckDB's table function takes a path pattern rather than a bind parameter -- there is
# no parameterised spelling of it. The interpolated values are a filesystem glob derived
# from typed partition keys and a predicate this repository writes, never anything a
# caller supplied; `fking.data.parquet.reader.scanned_file_count` states that on the one
# line in src/ that does it, and it carries its own inline noqa.
# S311: the shuffle that proves the writer sorts. A seeded Mersenne twister is exactly
# right here -- the test must be reproducible, which is what a cryptographic generator
# would take away.
# DTZ001: one deliberate naive datetime, in the test asserting the writer refuses one.
"tests/data/test_parquet_layout.py" = ["S101", "S311", "S608", "DTZ001"]
# S311: the reconnect backoff is seeded here on purpose. Production uses SystemRandom --
# jitter across replicas is the entire point of full jitter -- but a *test* of a
# schedule must be reproducible, and a cryptographic generator is exactly what takes
# that away. The suite asserts the schedule, not the entropy.
"tests/data/test_live_backoff.py" = ["S101", "S311"]
"tests/data/test_live_ingestion.py" = ["S101", "S311"]
# DTZ001: two naive datetimes on purpose. One is the anchor the schedule must refuse; the
# others are Hypothesis's `st.datetimes` bounds, which the strategy requires to be naive
# whenever `timezones=` is supplied -- an aware bound there is a TypeError from Hypothesis,
# so the DTZ-clean spelling is the one that cannot run.
"tests/platform/scheduler/test_schedule.py" = ["S101", "DTZ001"]
# DTZ001: the same, one file over -- the naive `as_of` the feature store must refuse.
# The rule exists so that a naive datetime never reaches the system by accident; a test
# that constructs one on purpose, to prove it is rejected, is the one place it must.
"tests/data/features/test_store_signature.py" = ["S101", "DTZ001"]
# S608: a migration is hand-written DDL over identifiers that are compiled into the
# file. DDL takes no bind parameters -- there is no parameterised spelling of
# `CREATE ROLE x` or `CREATE TRIGGER y ON z` -- and a migration never sees runtime
# input, because it is a static file reviewed in a pull request before it runs. The
# ignore is scoped to migrations/ alone; S608 stays on everywhere a string reaches SQL
# from anything a caller supplied.
"migrations/versions/*.py" = ["S608"]

[tool.ruff.lint.isort]
# `src` resolves first-party by looking for `<entry>/<package>`, which finds `fking`
# under src/ and misses `tests` and `tools` -- so without this, a test helper import
# sorts into the third-party block next to pytest. Naming them makes the three
# first-party roots explicit rather than inferred.
known-first-party = ["fking", "tests", "tools"]

[tool.ruff.lint.flake8-annotations]
# **kwargs: Any is how an unannotated boundary re-enters a --strict codebase.
allow-star-arg-any = false

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
# migrations/ is included: a migration is code that runs against the production
# database with no test around most of it, so it is the last place to accept an
# unchecked signature.
files = ["src", "tests", "tools", "migrations"]
strict = true
# tests/support/ is a package while tests/ deliberately is not, so mypy resolves the
# same file as both `support.domain_factory` and `tests.support.domain_factory` and
# refuses to continue. Anchoring package bases at the repository root gives it one
# name. Adding tests/__init__.py would also work and would change how pytest imports
# every test module, which is a larger change for the same fix.
explicit_package_bases = true
mypy_path = ["src", "."]
# --strict alone does not stop Any propagating out of an untyped import, which means
# one such import can silently disable type checking across an entire call path with
# no error reported. CODING_STANDARDS.md 5.1.
disallow_any_explicit = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true

# pydantic's BaseModel synthesises `__init__(**data: Any)`, so *every* `class X(BaseModel)`
# statement reports explicit-any -- the Any belongs to the library, not to this codebase,
# and there is no spelling of a pydantic model that avoids it. Scoped to the one module
# that declares models rather than relaxed globally, so an explicit `Any` written by hand
# anywhere else still fails.
[[tool.mypy.overrides]]
module = [
    "fking.agents.contracts",
    "fking.agents.declaration",
    "fking.backtest.costs._calibrate",
    "fking.backtest.costs._charge",
    "fking.backtest.costs._depth",
    "fking.backtest.costs._latency",
    "fking.backtest.costs._model",
    "fking.backtest.costs._spread",
    "fking.data.live.frames",
    "fking.execution.models",
    "fking.execution.venue_profile",
    "fking.platform.bus._envelope",
    "fking.platform.config.settings",
    "tests.agents.test_contracts",
    "tests.execution.test_response_parsing",
    "tests.platform.bus.test_registry",
    "tests.platform.bus.test_stream",
]
disallow_any_explicit = false

# ccxt ships no `py.typed` marker, so mypy refuses to analyse it and reports
# `import-untyped` at every import site. Narrowed to `ccxt.*` rather than set
# globally: `ignore_missing_imports` applied repository-wide would also silence a
# genuinely missing first-party module, which is a real error wearing a
# third-party packaging gap as a disguise.
#
# This does NOT weaken the safety kernel's guarantee. Nothing is inferred from
# ccxt's own annotations -- `guarded_ccxt` re-validates every URL in the sandbox
# map it returns, and `.claude/rules/safety-kernel.md` treats those endpoints as
# dependency-supplied input precisely because the type system cannot vouch for
# them.
[[tool.mypy.overrides]]
module = ["ccxt.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# import-linter -- the architecture diagram, made executable
# ---------------------------------------------------------------------------

[tool.importlinter]
root_package = "fking"
# Required for the network-client contract to see third-party modules at all.
# Without it that contract passes silently because the forbidden modules are
# absent from the analysed graph, and a silently-passing safety contract is worse
# than no contract.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point inward toward domain"
type = "layers"
# The container form rather than fully-qualified layer names: `exhaustive` is only
# supported for contracts with containers, and exhaustive is the point of this
# contract.
containers = ["fking"]
layers = [
    "api",
    "evolution",
    "agents",
    "backtest",
    "execution",
    "risk",
    "strategy",
    "data",
    "domain",
]
# Without exhaustive, a new top-level module is simply absent from the ordering and
# therefore unconstrained -- it may import anything and be imported by anything, and
# nobody notices for a year. platform is the sole ignore because it deliberately sits
# outside the layering: it holds mechanism, not policy.
exhaustive = true
exhaustive_ignores = ["platform"]

[[tool.importlinter.contracts]]
name = "Strategies never reach the order path"
type = "forbidden"
source_modules = ["fking.strategy"]
forbidden_modules = ["fking.execution", "fking.risk"]

[[tool.importlinter.contracts]]
name = "domain imports nothing but the standard library"
type = "forbidden"
source_modules = ["fking.domain"]
forbidden_modules = [
    "fking.agents",
    "fking.api",
    "fking.backtest",
    "fking.data",
    "fking.evolution",
    "fking.execution",
    "fking.platform",
    "fking.risk",
    "fking.strategy",
]

[[tool.importlinter.contracts]]
name = "strategy and risk are pure and never reach a database"
type = "forbidden"
# Purity in these two modules is what makes a strategy deterministically replayable and
# a risk decision reproducible from the audit log (CLAUDE.md 4). A database handle is
# I/O, a clock and a source of nondeterminism in one object -- and a risk limit checked
# against a value read mid-decision is a limit whose behaviour depends on scheduling.
# Rows reach them as arguments, from a caller that did the reading.
source_modules = ["fking.risk", "fking.strategy"]
forbidden_modules = ["alembic", "asyncpg", "redis", "sqlalchemy"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only the safety kernel constructs network clients"
type = "forbidden"
source_modules = [
    "fking.agents",
    "fking.api",
    "fking.backtest",
    "fking.data",
    "fking.domain",
    "fking.evolution",
    "fking.execution",
    "fking.risk",
    "fking.strategy",
]
# Top-level names only: import-linter rejects subpackages of external packages, so
# this is `urllib` rather than `urllib.request`.
#
# httpx and websockets are named here because #11 made them real dependencies, redis
# because #18 did, and aiohttp because #5 did -- ccxt brings it. Before that they were
# absent from the analysed graph, and a module that is not in the graph can never be
# found in a chain, so listing it was decoration rather than a check. requests is still
# absent and still omitted for the same reason.
#
# redis is here for a different reason from the others. It is not an egress risk -- it
# addresses local infrastructure, not a venue -- but a consumer that opens its own
# connection gets different decoding and no health check, and the divergence surfaces
# as a bytes/str branch nobody expected. fking.platform.bus is the one constructor.
#
# fking.platform is deliberately not a source module: the sanctioned path runs
# through fking.platform.safety, which must be able to import these.
forbidden_modules = ["aiohttp", "http", "httpx", "redis", "socket", "urllib", "websockets"]
# The sanctioned path is fking.execution -> fking.platform.safety -> httpx, which is
# an indirect import and must stay legal. Leaving this at the default false would
# fail the contract on the correct architecture.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only the safety kernel constructs a ccxt exchange"
type = "forbidden"
# ccxt needs its own contract rather than a line in the one above, because it is not a
# transport -- it *contains* one. A module holding `ccxt` can write
# `ccxt.binance({...})` and get an exchange with an unguarded aiohttp session, and the
# network-client contract would see `fking.execution -> ccxt` and pass: the forbidden
# import is two hops away and indirect chains are deliberately allowed there.
#
# So the adapter never names ccxt at all. It holds `GuardedExchange`, a Protocol in the
# kernel whose one implementation carries an injected session and re-validates the URL
# map that `set_sandbox_mode(True)` installs (ADR-0008, .claude/rules/safety-kernel.md).
#
# fking.platform is not a source module: fking.platform.safety.exchange is the one place
# that may hold it, and that module is inside the kernel's 100% coverage floor.
source_modules = [
    "fking.agents",
    "fking.api",
    "fking.backtest",
    "fking.data",
    "fking.domain",
    "fking.evolution",
    "fking.execution",
    "fking.risk",
    "fking.strategy",
]
forbidden_modules = ["ccxt"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The order path cannot reach the archive egress client"
type = "forbidden"
# Two egress paths that cannot see each other is the property #22 buys instead of one
# allowlist with an extra host on it. PERMITTED_HOSTS is not a permission list -- it is
# a proof about which hosts a process holding order-placement code can reach at all --
# so `data.binance.vision` never enters it, and the client that can reach it never
# enters the order path. Read paths become write paths during refactors (CLAUDE.md 11),
# and this contract is what makes that refactor fail CI instead of shipping.
#
# fking.platform.safety.archive is deliberately not re-exported from
# fking.platform.safety.__init__, so this contract has something to forbid: a
# re-export would put the archive client one attribute access away from every module
# that already imports the trading kernel, and no import edge would record it.
source_modules = ["fking.execution"]
forbidden_modules = ["fking.data.archive", "fking.platform.safety.archive"]

[[tool.importlinter.contracts]]
name = "The archive egress path holds no credentials"
type = "forbidden"
# A client that cannot authenticate cannot place an order even if a future refactor
# points it at the wrong host, so the absence of a credential is a second barrier
# behind the allowlist -- and a barrier that exists only because nobody has yet written
# `from fking.platform.config import settings` is not a barrier.
#
# fking.platform.config is where every SecretStr in this system lives, which is why it
# is the concrete spelling of "credential source" here. The consequence is that the
# cache root is a constructor argument rather than something the fetcher reads, which
# is also the more testable shape.
source_modules = ["fking.data.archive", "fking.platform.safety.archive"]
forbidden_modules = ["fking.execution", "fking.platform.config"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Explicit rather than relying on `python -m pytest` happening to put the working
# directory on sys.path: without this, `import tools.checks` works under `make test`
# and fails under a bare `pytest`, which is a difference nobody enjoys diagnosing.
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
    # pytest-randomly shuffles order and reseeds random/numpy per test. The seed is
    # pinned so an order-dependent failure reproduces exactly from the CI log.
    "--randomly-seed=20260801",
    "--cov=src/fking",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
]
markers = [
    "unit: in-process, no container, no network, under 100ms",
    "integration: requires a testcontainer (Postgres/TimescaleDB or Redis)",
    "property: Hypothesis-driven; profile selected by HYPOTHESIS_PROFILE",
    "slow: over 5s wall clock; excluded from the local default profile",
]
filterwarnings = ["error"]
xfail_strict = true
asyncio_mode = "strict"

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["src/fking"]
# parallel stays off until pytest-xdist arrives: with it on, pytest-cov combines the
# data files itself, and a second `coverage combine` in the Makefile then fails with
# "No data to combine". Turning it on is part of the CI work in #15.
parallel = false

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "class .*\\(Protocol\\):",
    # The `python -m` entry guard. Two tokens of glue whose body is one call to a
    # fully tested function; it cannot execute under the test runner because the
    # module is imported rather than run. The command it guards is separately
    # verified end to end by a subprocess test, so this excludes a line, not a
    # behaviour.
    "if __name__ == .__main__.:",
]
