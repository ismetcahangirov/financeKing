# Alembic configuration.
#
# `sqlalchemy.url` is deliberately absent. The DSN comes from the settings tree in
# migrations/env.py, so `make migrate` and the running application read the same value
# from the same place. A URL duplicated here is a URL that drifts, and the direction it
# drifts in is "migrations were applied to a database the app never opens".

[alembic]
script_location = migrations
prepend_sys_path = src
# Explicit, because Alembic's legacy fallback splits paths on spaces, commas AND colons
# -- and this repository is developed on Windows, where `C:\...` contains a colon. The
# legacy splitter turns one path into two nonexistent ones and the import fails with a
# message about the package rather than about the path.
path_separator = os

# Revision ids are hand-written as ordered, readable names (0001_..., 0002_...) rather
# than generated hex. The ordering is the review artefact: a reviewer reading
# `down_revision = "0004_strategy_and_evolution"` knows where in history a change lands
# without opening four other files.
file_template = %%(rev)s
timezone = UTC

[post_write_hooks]
# Generated migrations go through the same formatter as everything else, so a
# `make format` after an autogenerate produces no diff of its own.
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Logging is configured by the application (structlog, JSON). Alembic's own fileConfig
# would replace those handlers with plaintext ones for the duration of the migration,
# which is exactly the window whose records you want in the same format as the rest.
[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
